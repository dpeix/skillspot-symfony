# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    app.mailer_from: '%env(MAILER_FROM)%'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    App\Identity\Domain\Repository\UserRepositoryInterface: '@App\Identity\Infrastructure\Doctrine\UserRepository'
    App\Identity\Domain\Repository\OrganizerApplicationRepositoryInterface: '@App\Identity\Infrastructure\Doctrine\OrganizerApplicationRepository'
    App\Workshop\Domain\Repository\WorkshopRepositoryInterface: '@App\Workshop\Infrastructure\Doctrine\WorkshopRepository'
    App\Workshop\Domain\Repository\WorkshopSessionRepositoryInterface: '@App\Workshop\Infrastructure\Doctrine\WorkshopSessionRepository'
    App\Booking\Domain\Repository\BookingRepositoryInterface: '@App\Booking\Infrastructure\Doctrine\BookingRepository'
    App\Shared\Application\TransactionManagerInterface: '@App\Shared\Infrastructure\DoctrineTransactionManager'
    App\Shared\Application\Notification\TransactionalNotifierInterface: '@App\Shared\Infrastructure\Notification\MessengerTransactionalNotifier'
    App\Shared\Application\Realtime\AvailabilityPublisherInterface: '@App\Shared\Infrastructure\Realtime\MessengerAvailabilityPublisher'

    App\Shared\Infrastructure\Messenger\SendTransactionalEmailHandler:
        arguments:
            $mailerFrom: '%app.mailer_from%'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones
